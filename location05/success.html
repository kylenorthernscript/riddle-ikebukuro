<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎解き完了 - Tokyo Mystery Challenge</title>
  <style>
    :root {
      --ink-black: #0B0F14;
      --charcoal: #12161C;
      --parchment: #F4F1EC;
      --amber: #FFC773;
      --cyan: #39C6F4;
      --success-green: #22C55E;
      --card-bg: rgba(255, 255, 255, 0.02);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--ink-black);
      background-image: 
        radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(57, 198, 244, 0.06) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--parchment);
    }

    body::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.1), transparent 70%);
      transform: translate(-50%, -50%);
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
    }

    .container {
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 1;
      margin: 2rem auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 4px 6px rgba(0, 0, 0, 0.3),
        0 10px 40px rgba(0, 0, 0, 0.2),
        0 0 80px rgba(34, 197, 94, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
      position: relative;
      animation: fadeIn 0.4s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .success-badge {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--success-green), #16A34A);
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .trophy-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: block;
      color: var(--amber);
      animation: rotate 2s ease-in-out infinite;
    }

    @keyframes rotate {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
      font-size: 2.5rem;
      font-weight: 500;
      background: linear-gradient(135deg, var(--success-green), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin: 0 0 1rem;
      letter-spacing: 0.04em;
    }

    .congrats-text {
      color: var(--parchment);
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .video-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 2rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 199, 115, 0.2);
    }

    .next-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, var(--cyan), #20B4E8);
      border: none;
      border-radius: 8px;
      color: var(--ink-black);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .next-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(57, 198, 244, 0.3);
    }

    .next-btn:hover::before {
      left: 100%;
    }

    .map-clickable {
      cursor: pointer;
      position: relative;
    }

    .map-clickable:hover::after {
      content: '🔍 クリックして拡大';
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal:hover {
      color: var(--amber);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="success-badge">謎解き完了</div>

      <svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8"/>
        <path d="M12 17v4"/>
        <path d="M7 4v8a5 5 0 0 0 10 0V4"/>
        <path d="M2 4h5"/>
        <path d="M17 4h5"/>
        <path d="M2 4v3a3 3 0 0 0 3 3h2"/>
        <path d="M22 4v3a3 3 0 0 1-3 3h-2"/>
      </svg>

      <h1>よくできました！</h1>

      <p class="congrats-text">
        歴史的な謎を見事に解きました！
      </p>

      <!-- Video Embed -->
      <div style="width: 100%; max-width: 480px; aspect-ratio: 16/9; position: relative; margin: 1.5rem auto; overflow: hidden;">
        <iframe src="https://video.pictory.ai/embed/20250902090018482ba4161e464554b0db659f6ad7a07b6ab/20250902091347772tXKrV6wg9RKnwB7"
        title="Checkpoint 6" style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen>
        </iframe>
      </div>
      
      <div style="background: rgba(255, 199, 115, 0.05); border: 1px solid rgba(255, 199, 115, 0.2); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem;">
        <h2 style="color: #FFC773; font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; text-align: center; font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif;">巣鴨プリズンについて</h2>
        <p style="color: rgba(244, 241, 236, 0.8); font-size: 0.95rem; line-height: 1.7; text-align: center;">
          巣鴨プリズンは、1895年から1971年まで東京で運営されていた有名な拘置施設でした。
          第二次世界大戦後、連合国占領下で日本の戦犯を収容する施設として有名になりました。
          刑務所は最終的に取り壊され、その跡地は東池袋中央公園に生まれ変わり、
          かつて歴史の暗い一章が刻まれた場所に、平和な公共スペースが誕生しました。
        </p>
      </div>

      <!-- Map Image -->
      <div class="map-clickable" style="margin: 1.5rem 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 199, 115, 0.2);" id="mapContainer">
        <img
          src="/location06-map.png"
          alt="東池袋中央公園への地図"
          style="width: 100%; height: auto; display: block;"
          id="mapImage"
        />
      </div>

      <a href="/location06.html" class="next-btn">
        最終目的地へ進む →
      </a>
    </div>
  </div>

  <!-- Modal for enlarged map -->
  <div id="mapModal" class="modal">
    <span class="close-modal" id="closeBtn">&times;</span>
    <img class="modal-content" id="modalMapImage" alt="東池袋中央公園への地図">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const mapContainer = document.getElementById('mapContainer');
      const modal = document.getElementById('mapModal');
      const modalImg = document.getElementById('modalMapImage');
      const mapImg = document.getElementById('mapImage');
      const closeBtn = document.getElementById('closeBtn');

      // Open modal when map is clicked
      if (mapContainer) {
        mapContainer.addEventListener('click', function() {
          modal.classList.add('active');
          modalImg.src = mapImg.src;
        });
      }

      // Close modal when X is clicked
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          modal.classList.remove('active');
        });
      }

      // Close modal when clicking outside the image
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.classList.remove('active');
          }
        });
      }

      // Close modal when pressing Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          modal.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
