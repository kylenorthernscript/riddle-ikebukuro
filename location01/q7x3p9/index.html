<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックポイント - Tokyo Mystery Challenge</title>
  <style>
    :root {
      --ink-black: #0B0F14;
      --charcoal: #12161C;
      --parchment: #F4F1EC;
      --amber: #FFC773;
      --cyan: #39C6F4;
      --card-bg: rgba(255, 255, 255, 0.02);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--ink-black);
      background-image:
        radial-gradient(circle at 20% 50%, rgba(57, 198, 244, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 199, 115, 0.05) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%23FFC773' stroke-width='0.1' fill='none' opacity='0.03'%3E%3Cpath d='M0 20h40M20 0v40'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .container {
      max-width: 420px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 199, 115, 0.1);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.3),
        0 10px 40px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      background: linear-gradient(135deg, rgba(255, 199, 115, 0.2), transparent 50%, rgba(57, 198, 244, 0.1));
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:has(input:focus)::before {
      opacity: 1;
    }

    .owl-icon {
      position: absolute;
      top: -24px;
      right: 24px;
      width: 48px;
      height: 48px;
      opacity: 0.15;
    }

    h1 {
      font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 500;
      color: var(--amber);
      text-align: center;
      margin: 0 0 1.5rem;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .description {
      color: var(--parchment);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      text-align: center;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: var(--amber);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 199, 115, 0.2);
      border-radius: 8px;
      color: var(--parchment);
      font-family: 'UI Monospace', 'Cascadia Code', 'Roboto Mono', monospace;
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      text-align: center;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--amber);
      background: rgba(0, 0, 0, 0.5);
      box-shadow:
        0 0 0 3px rgba(255, 199, 115, 0.1),
        inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    input::placeholder {
      color: rgba(244, 241, 236, 0.3);
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, var(--amber), #FFB347);
      border: none;
      border-radius: 8px;
      color: var(--ink-black);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 199, 115, 0.3);
    }

    button:not(:disabled):active::before {
      width: 300px;
      height: 300px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: linear-gradient(135deg, #999, #777);
    }

    #message {
      margin-top: 1.5rem;
      min-height: 60px;
    }

    .message {
      border-radius: 12px;
      font-size: 1.1rem;
      text-align: center;
      animation: slideIn 0.3s ease;
      padding: 1rem 1.5rem;
      margin: 0 auto;
    }

    .message.error {
      background: linear-gradient(135deg, #EF4444, #DC2626) !important;
      border: 3px solid #FCA5A5 !important;
      color: #FFFFFF !important;
      font-weight: 700 !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
      box-shadow:
        0 0 20px rgba(239, 68, 68, 0.6),
        0 4px 12px rgba(0, 0, 0, 0.3) !important;
      position: relative !important;
    }

    .message.error::before {
      content: '⚠️';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
    }

    .message.success {
      background: linear-gradient(135deg, #22C55E, #16A34A);
      border: 3px solid #86EFAC;
      color: #FFFFFF;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      box-shadow:
        0 0 20px rgba(34, 197, 94, 0.6),
        0 4px 12px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .message.success::before {
      content: '✓';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
    }

    .hint {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 199, 115, 0.1);
      color: rgba(244, 241, 236, 0.5);
      font-size: 0.75rem;
      line-height: 1.5;
      text-align: center;
    }

    .attempts-warning {
      color: var(--amber);
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .lockout-timer {
      color: var(--cyan);
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'UI Monospace', monospace;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(57, 198, 244, 0.3);
      }
      50% {
        box-shadow: 0 0 40px rgba(57, 198, 244, 0.5);
      }
    }

    .success-glow {
      animation: glow 0.4s ease;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="checkpointCard">
      <svg class="owl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12h.01M15 12h.01M12 21c-1.5 0-3-1-3-3v-1m6 1v1c0 2-1.5 3-3 3m-6-6c0 4.5 3 7 6 7s6-2.5 6-7c0-3-2-6-6-6s-6 3-6 6z"/>
        <path d="M8 9c0-2 1-3 1-3s1 1 1 3m4-3s1 1 1 3"/>
      </svg>

      <h1>チェックポイント</h1>

      <p class="description">
        冊子に記載された8文字のキーワード（a→h）を入力してください。<br>
        すべて大文字、スペースなしで入力してください。
      </p>

      <form id="checkpointForm">
        <div class="form-group">
          <label for="keyword">キーワード</label>
          <input
            type="text"
            id="keyword"
            name="keyword"
            placeholder="8文字"
            maxlength="20"
            autocomplete="off"
            aria-describedby="keywordHint"
            required
          />
        </div>

        <button type="submit" id="submitBtn">
          進む
        </button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="hint" id="keywordHint">
        O/0やI/1の混同がある場合は、慎重に再入力してください。<br>
        このページは後ほど位置情報の確認を求める場合があります。
      </div>
    </div>
  </div>

  <script>
    console.log('スクリプト開始...');

    const form = document.getElementById('checkpointForm');
    const input = document.getElementById('keyword');
    const button = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const card = document.getElementById('checkpointCard');

    console.log('要素の取得:', { form, input, button, messageDiv, card });

    const expectedHash = 'd0cd83ac866158bb23a7519f09b78b366cc381c5e78637ec42c00ac8289e6f0e';
    const successPath = '/location01/q7x3p9/f4kt0d/';

    let attemptCount = 0;
    let lockoutUntil = null;

    // 入力時に自動的に大文字変換し、文字以外をフィルタリング
    input.addEventListener('input', (e) => {
      console.log('入力イベント発火');
      const target = e.target;
      const cursorPos = target.selectionStart;
      const filtered = target.value.toUpperCase().replace(/[^A-Z]/g, '');
      target.value = filtered;

      // カーソル位置を維持
      if (cursorPos !== null) {
        target.setSelectionRange(cursorPos, cursorPos);
      }

      // ボタンの有効/無効を切り替え
      button.disabled = filtered.length === 0;
    });

    // ロックアウトチェック
    function checkLockout() {
      if (lockoutUntil && Date.now() < lockoutUntil) {
        const remaining = Math.ceil((lockoutUntil - Date.now()) / 1000);
        showMessage('試行回数が多すぎます。<span class="lockout-timer">' + remaining + '秒</span>後に再試行してください', 'error');
        button.disabled = true;
        input.disabled = true;

        setTimeout(checkLockout, 1000);
      } else if (lockoutUntil && Date.now() >= lockoutUntil) {
        lockoutUntil = null;
        attemptCount = 0;
        input.disabled = false;
        button.disabled = input.value.length === 0;
        messageDiv.innerHTML = '';
      }
    }

    // SHA-256ハッシュ関数
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    // メッセージ表示
    function showMessage(text, type) {
      if (type === 'error') {
        messageDiv.innerHTML = '<div class="message error" style="background: linear-gradient(135deg, #EF4444, #DC2626); border: 3px solid #FCA5A5; color: #FFFFFF; font-weight: 700; padding: 1rem 1.5rem; border-radius: 12px; text-align: center; margin: 0 auto; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);">⚠️ ' + text + '</div>';
      } else if (type === 'success') {
        messageDiv.innerHTML = '<div class="message success" style="background: linear-gradient(135deg, #22C55E, #16A34A); border: 3px solid #86EFAC; color: #FFFFFF; font-weight: 700; padding: 1rem 1.5rem; border-radius: 12px; text-align: center; margin: 0 auto; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); box-shadow: 0 0 20px rgba(34, 197, 94, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);">✓ ' + text + '</div>';
        card.classList.add('success-glow');
      }
    }

    // フォーム送信
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log('フォーム送信');

      if (lockoutUntil && Date.now() < lockoutUntil) {
        checkLockout();
        return;
      }

      const rawInput = input.value;
      const normalized = rawInput.trim().toUpperCase().replace(/[^A-Z]/g, '');

      console.log('正規化された入力:', normalized);

      // 長さチェック
      if (normalized.length !== 8) {
        attemptCount++;
        showMessage('キーワードは正確に8文字である必要があります', 'error');

        if (attemptCount >= 5) {
          lockoutUntil = Date.now() + 30000;
          checkLockout();
        } else if (attemptCount >= 3) {
          showMessage('キーワードは正確に8文字である必要があります<div class="attempts-warning">残り' + (5 - attemptCount) + '回の試行</div>', 'error');
        }

        return;
      }

      // ハッシュ検証
      const hash = await sha256(normalized);
      console.log('計算されたハッシュ:', hash);
      console.log('期待されるハッシュ:', expectedHash);

      if (hash === expectedHash) {
        showMessage('アクセス許可！', 'success');
        button.disabled = true;
        input.disabled = true;

        // 短い遅延後に遷移
        setTimeout(() => {
          window.location.href = successPath;
        }, 400);
      } else {
        attemptCount++;

        if (attemptCount >= 5) {
          lockoutUntil = Date.now() + 30000;
          checkLockout();
        } else if (attemptCount >= 3) {
          showMessage('キーワードが正しくありません<div class="attempts-warning">残り' + (5 - attemptCount) + '回の試行</div>', 'error');
        } else {
          showMessage('キーワードが正しくありません', 'error');
        }
      }
    });

    // 初期状態
    button.disabled = true;
    console.log('スクリプト読み込み完了');
  </script>
</body>
</html>
