<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="-1">
  <meta http-equiv="Last-Modified" content="0">
  <meta http-equiv="If-Modified-Since" content="0">
  <meta name="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="expires" content="0">
  <meta name="pragma" content="no-cache">
  <title>Field Node L3 - Tokyo Mystery Challenge</title>
  <link rel="stylesheet" href="location-styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="chapter-badge">チャプター 2 - フィールドノード L3</div>

      <div class="location-icon">🏭</div>

      <h1>位置確認: フィールドノード L3</h1>
      <div class="location-subtitle">ミステリーチェックポイント L3</div>

      <p class="description">
        このボタンを押して、目標地点からの距離を確認してください。<br>次の手がかりをアンロックするには範囲内にいる必要があります。
      </p>

      <div class="target-info">
        <div class="target-name">目標: 不明な場所</div>
        <div class="coordinates">35.73405°N, 139.71381°E</div>
      </div>

      <button id="checkLocationBtn" class="check-btn" onclick="checkLocation()">
        🔍 現在地を確認
      </button>

      <div id="result" class="result"></div>

      <!-- Hidden test button -->
      <button id="testSuccessBtn" style="position: fixed; bottom: 10px; right: 10px; opacity: 0.1; padding: 5px 10px; font-size: 10px; cursor: pointer; z-index: 999;">
        Test
      </button>

      <!-- Test link for development -->
      <div style="position: absolute; bottom: 10px; left: 10px;">
        <a href="#" id="testSuccessLink" style="color: rgba(255,255,255,0.4); text-decoration: none; font-size: 11px; padding: 4px 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; background: rgba(0,0,0,0.3); display: inline-block; transition: all 0.2s;">
          🧪 成功をテスト
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    // 新しいモジュールシステムを使用
    import { initializePage } from './js/pageInit.js';
    import { showResult } from './js/ui.js';

    // ロケーション固有の設定
    const config = {
      targetLat: 35.73405,
      targetLng: 139.71381,
      locationName: 'ミステリーチェックポイント L3',
      successRedirectUrl: 'location03/m3j7n2k8.html',
      requireAltitude: false
    };

    initializePage(config);

    // テストリンクの設定
    document.addEventListener('DOMContentLoaded', () => {
      const testLink = document.getElementById('testSuccessLink');
      if (testLink) {
        testLink.addEventListener('click', (e) => {
          e.preventDefault();
          testLink.style.color = 'rgba(255,255,255,0.8)';
          testLink.style.borderColor = 'rgba(255,255,255,0.4)';

          const timestamp = new Date().toLocaleTimeString();
          showResult({
            distance: 0,
            accuracy: 5,
            userLat: config.targetLat,
            userLng: config.targetLng,
            targetLat: config.targetLat,
            targetLng: config.targetLng,
            locationName: config.locationName,
            successRedirectUrl: config.successRedirectUrl,
            debugInfo: `🧪 テストモード - シミュレーション時刻: ${timestamp}`
          });
        });

        testLink.addEventListener('mouseenter', () => {
          testLink.style.color = 'rgba(255,255,255,0.7)';
          testLink.style.borderColor = 'rgba(255,255,255,0.3)';
          testLink.style.background = 'rgba(0,0,0,0.5)';
        });

        testLink.addEventListener('mouseleave', () => {
          testLink.style.color = 'rgba(255,255,255,0.4)';
          testLink.style.borderColor = 'rgba(255,255,255,0.2)';
          testLink.style.background = 'rgba(0,0,0,0.3)';
        });
      }
    });
  </script>
</body>
</html>
